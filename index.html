<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Drifty Race 95 (alpha 1.3)</title>
    <style>
      /* The game fills whatever window it's given (itch.io's frame, or fullscreen), kept at 16:9 with black
         bars on the long sides. No Unity footer, so nothing gets pushed off the bottom. */
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      #frame { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      #unity-canvas {
        display: block; background: #0a0618; outline: none;
        width: min(100vw, calc(100vh * 16 / 9));
        height: min(100vh, calc(100vw * 9 / 16));
      }
      #loading {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        width: min(320px, 60vw); text-align: center; font: bold 14px monospace; color: #ffe63b; letter-spacing: 2px;
      }
      #bar { margin-top: 10px; height: 12px; border: 2px solid #19f0e0; background: #1a0f33; }
      #fill { height: 100%; width: 0%; background: #ff2e96; }
      #warning { position: absolute; left: 0; right: 0; top: 0; font: 14px sans-serif; color: #000; }
    </style>
  </head>
  <body>
    <div id="frame">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="loading">LOADING<div id="bar"><div id="fill"></div></div></div>
      <div id="warning"></div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      function showBanner(msg, type) {
        var warning = document.querySelector("#warning");
        var div = document.createElement("div");
        div.innerHTML = msg;
        div.style = "padding: 10px; background: " + (type == "error" ? "red" : "yellow") + ";";
        warning.appendChild(div);
        if (type != "error") setTimeout(function () { warning.removeChild(div); }, 5000);
      }

      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/driftyrace_web1.33.data.unityweb",
        frameworkUrl: buildUrl + "/driftyrace_web1.33.framework.js.unityweb",
        codeUrl: buildUrl + "/driftyrace_web1.33.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Drifty Race 95 (alpha 1.3)",
        productVersion: "1.33",
        showBanner: showBanner,
      };

      // Clicking the game gives it the keyboard, even inside itch.io's frame.
      canvas.addEventListener("pointerdown", function () { canvas.focus(); window.focus(); });

      var script = document.createElement("script");
      script.src = buildUrl + "/driftyrace_web1.33.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#fill").style.width = 100 * progress + "%";
        }).then(function () {
          document.querySelector("#loading").style.display = "none";
          canvas.focus();
        }).catch(function (message) {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
<script defer src="https://static.itch.io/htmlgame.js" type="text/javascript"></script>
